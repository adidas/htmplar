name: Publish to npm

on:
  # Trigger on GitHub releases
  release:
    types: [published]

  # Manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      npm-tag:
        description: 'npm dist-tag (latest, alpha, beta, next)'
        required: true
        type: choice
        options:
          - alpha
          - beta
          - next
          - latest
        default: 'alpha'

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  publish:
    name: Build and Publish to npm
    runs-on: ubuntu-latest
    environment: pro
    permissions:
      contents: read
      id-token: write # Required for OIDC Trusted Publishing

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build all packages
        run: npm run build

      - name: Publish to npm with provenance
        run: npm publish --workspaces --access public --tag ${{ inputs.npm-tag || 'alpha' }} --provenance

      - name: Get package versions
        id: versions
        run: |
          CORE_VERSION=$(node -p "require('./packages/core/package.json').version")
          RENDERER_VERSION=$(node -p "require('./packages/renderer/package.json').version")
          CLI_VERSION=$(node -p "require('./packages/cli/package.json').version")
          CREATE_VERSION=$(node -p "require('./packages/create-htmplar/package.json').version")
          echo "core=$CORE_VERSION" >> $GITHUB_OUTPUT
          echo "renderer=$RENDERER_VERSION" >> $GITHUB_OUTPUT
          echo "cli=$CLI_VERSION" >> $GITHUB_OUTPUT
          echo "create=$CREATE_VERSION" >> $GITHUB_OUTPUT

      - name: Summary
        run: |
          echo "## 🚀 Published to npm" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tag**: \`${{ inputs.npm-tag || 'alpha' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Packages Published:" >> $GITHUB_STEP_SUMMARY
          echo "- @adidas/htmplar-core@${{ steps.versions.outputs.core }}" >> $GITHUB_STEP_SUMMARY
          echo "- @adidas/htmplar-renderer@${{ steps.versions.outputs.renderer }}" >> $GITHUB_STEP_SUMMARY
          echo "- @adidas/htmplar-cli@${{ steps.versions.outputs.cli }}" >> $GITHUB_STEP_SUMMARY
          echo "- @adidas/create-htmplar@${{ steps.versions.outputs.create }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Quick Start:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "npx @adidas/create-htmplar@${{ inputs.npm-tag || 'alpha' }} my-project" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
