name: Publish to npm

on:
  # Trigger on GitHub releases
  release:
    types: [published]

  # Manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      npm-tag:
        description: 'npm dist-tag (latest, alpha, beta, next)'
        required: true
        type: choice
        options:
          - alpha
          - beta
          - next
          - latest
        default: 'alpha'

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  publish:
    name: Build and Publish to npm
    runs-on: ubuntu-latest
    environment: pro
    permissions:
      contents: read
      id-token: write # Required for OIDC Trusted Publishing

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build all packages
        run: npm run build

      - name: Publish to npm with provenance
        run: npm publish --workspaces --access public --tag ${{ inputs.npm-tag || 'alpha' }} --provenance

      - name: Summary
        run: |
          echo "## 🚀 Published to npm" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tag**: \`${{ inputs.npm-tag || 'alpha' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Packages Published:" >> $GITHUB_STEP_SUMMARY
          echo "- @adidas/htmplar-core@2.0.0-alpha.0" >> $GITHUB_STEP_SUMMARY
          echo "- @adidas/htmplar-renderer@2.0.0-alpha.0" >> $GITHUB_STEP_SUMMARY
          echo "- @adidas/htmplar-cli@2.0.0-alpha.0" >> $GITHUB_STEP_SUMMARY
          echo "- @adidas/create-htmplar@2.0.0-alpha.0" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Install:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "npm install @adidas/htmplar-core@${{ inputs.npm-tag || 'alpha' }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
